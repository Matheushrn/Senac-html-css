<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Css/style.css">
    <title>Odonto</title>
</head>
<body>
    <div class="wrapper">

        <!-- logo do site -->
        <div class="logo">
            <img src="Imagens/logo.png" alt="" class="logoimg">
        </div>

        <!-- menu de navegação -->

        <div class="menu">
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <span class="odonto"><li><a href="odonto.html">OdontoClinc</a></li></span>
                    <li><a href="servicos.html">Serviços</a></li>
                    <li><a href="contato.html">Fale Conosco</a></li>
                </ul>
            </nav>
        </div>


        <!-- Imagem lateral  -->
        <div class="imgcontato">
            <img src="" alt="">
        </div>

        <!-- formulário -->
        <div class="form">
            <form method="POST" action="mailto:odonto@gmail.com" class="contato">

                <!-- Campo nome -->
                <p>
                    <label for="cNome">Nome:</label>
                    <input type="text" name="tNome" class="cNome" size="40" maxlength="20" autofocus required>
                </p>

                <!-- Campo endereço -->
                <p>
                    <label for="cRua">Endereço: </label>
                    <input type="text" name="tRua" class="cRua" size="40" placeholder="Rua,Avenida,Travessa" required>
                </p>

                <!-- Campo Telefone -->
                <p>
                    <label for="cTel">Telefone: </label>
                    <input type="tel" name="tMail" class="cTel" size="40" maxlength="11" placeholder="99 9999-9999" required>
                </p>

                <!-- Campo Email -->
                <p>
                    <label for="cEmail">Email: </label>
                    <input type="email" name="tMail" class="cMail" size="40" maxlength="30" placeholder="exemplo@email.com" required>
                </p>

                <!-- area de comentário -->
                <label for="cMsg">Mensagem: </label><br>
                    <textarea name="tMsg" class="cMsg" cols="40" rows="5" placeholder="Deixe sua mensagem aqui"></textarea>
                <br>

                <!-- botão enviar -->
                <input type="submit" name="Enviar" class="button">
            </form>
        </div>
        <!-- redes sociais -->

        <div class="redesociais">
           <div class="rede"><a href="#"><img src="Imagens/facebook.png" alt="" class="rede"></a>
        </div>
        <div class="rede">
             <a href="#"><img src="Imagens/instagram.png" alt="" class="rede"></a>
        </div>
        <div class="rede">
            <a href="#"><img src="Imagens/whatsapp.png" alt="" class="rede"></a>
        </div>
            
        </div>

        <!-- rodapé -->

        <div class="footer">
            <footer>
                <p>Todos os direitos reservados - 2026</p>
            </footer>
        </div>

    </div>
</body>
</html>
