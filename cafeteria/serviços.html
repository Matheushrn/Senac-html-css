<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="favicon/logo.avif" type="image/x-icon">
    <title>Serviços</title>
</head>
<body>
    <div id="container">
        <header id="topo">
            <!-- Navegação -->
            <nav>
        <!-- Acessibilidade para cegos -->
                <ul>
                    <img src="imagens/logo.avif" alt="" class="logo">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="produtos.html">Produtos</a></li>
                    <li><a href="serviços.html" class="ativo">Serviços</a></li>
                </ul>
            </nav>

        </header>

        <h1>Contate-nos</h1>
        
        <section id="imgservico">

            <img src="imagens/contato.jpg" alt="" class="imgserv"> 

        </section>

        <section id="form">
            <form method="POST" action="mailto:coffelove@gmail.com" id="contato">
                <!--
                Metod POST - para guardar conteudo
                Metod GET - para pesquisa
                action para enviar para email 
                -->

                <!-- Campo nome -->
                <p>
                    <label for="cNome">Nome:</label>
                    <input type="text" name="tNome" id="cNome" size="40" maxlength="20" autofocus required>
                </p>

                <!-- Campo endereço -->
                <p>
                    <label for="cRua">Endereço: </label>
                    <input type="text" name="tRua" id="cRua" size="40" placeholder="Rua,Avenida,Travessa" required>
                </p>

                <!-- Campo Telefone -->
                <p>
                    <label for="cTel">Telefone: </label>
                    <input type="tel" name="tMail" id="cTel" size="40" maxlength="11" placeholder="99 9999-9999" required>
                </p>

                <!-- Campo Email -->
                <p>
                    <label for="cEmail">Email: </label>
                    <input type="email" name="tMail" id="cMail" size="40" maxlength="30" placeholder="exemplo@email.com" required>
                </p>

                <!-- area de comentário -->
                <label for="cMsg">Mensagem: </label><br>
                <textarea name="tMsg" id="cMsg" cols="40" rows="5" placeholder="Deixe sua mensagem aqui"></textarea>
                <br>

                <!-- botão enviar -->
                <input type="submit" name="Enviar" class="button">
            </form>

        </section>

        <!-- Rodapé -->
        <footer id="rodape">

            <p>Todos os direitos reservados - 2026</p>

        </footer>
    </div>
</body>
</html>

<!-- 
Label - rótulo que virá antes da caixa for para posicionar a caixa 
input - caixa para digitar tipo de texto
size - tamanho da caixa
maxlength - quantidade permitida de caracteres
autofocus - quando página carrega o cursor já fica ativo na caixa
required - campo obrigatório  
-->
